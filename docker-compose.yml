services:
  postgres:
    image: postgres:17-alpine
    container_name: bbstat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbstat
      POSTGRES_PASSWORD: bbstat
      POSTGRES_DB: bbstat
    # Non-standard host port (default 15432) so this stack doesn't collide
    # with a host-installed postgres or another project's test containers
    # bound to 5432. Override via POSTGRES_HOST_PORT in .env if you need to.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432'
    volumes:
      - bbstat-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bbstat -d bbstat']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bbstat-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    # Non-standard host port (default 16379) — same rationale as postgres.
    # Override via REDIS_HOST_PORT in .env.
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - bbstat-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bbstat-pg-data:
  bbstat-redis-data:
