services:
  postgres:
    image: postgres:17-alpine
    container_name: bbstat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbstat
      POSTGRES_PASSWORD: bbstat
      POSTGRES_DB: bbstat
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bbstat-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bbstat -d bbstat']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bbstat-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - bbstat-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bbstat-pg-data:
  bbstat-redis-data:
