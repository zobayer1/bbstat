# Frontend nginx config. Serves the Vite-built SPA on plain HTTP. The
# external reverse proxy (Traefik in dev, deployer's proxy in prod) terminates
# TLS; this container never sees a certificate.
#
# Same-origin /api/* is proxied to the backend container over Docker's
# internal DNS (`backend` resolves via compose's default network). The browser
# only sees one origin, which is the whole point of the same-origin scheme.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default MIME types include text/html, application/javascript, text/css,
    # image/svg+xml, application/json — sufficient for Vite output.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Vite emits content-hashed filenames under /assets/, so they're safe to
    # cache forever. Index.html itself MUST stay short-cached so deploys
    # actually surface.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — any path that isn't a real file falls back to index.html
    # so Vue Router can render the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Index.html: no caching. A deploy must invalidate immediately.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Docker's embedded DNS server. Lets us resolve service names like
    # `backend` at request time (via the variable in proxy_pass below)
    # rather than at startup. Without this, nginx would refuse to boot if
    # the backend container weren't already running and resolvable.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # API proxy. `backend` resolves to the backend container via compose's
    # internal network. Keep this in lockstep with the backend's listening
    # port (BACKEND_PORT=8080 by default in the backend image).
    location /api/ {
        # Putting the upstream in a variable forces nginx to do DNS at
        # request time instead of config-load time. Required so this
        # container can boot independently of the backend.
        set $backend_upstream "http://backend:8080";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # /api/live is an SSE stream — needs unbuffered, long-lived
        # connections. Disabling buffering globally on /api/ is fine; the
        # rest of the API is short-lived JSON and doesn't suffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Container HEALTHCHECK probe — never reachable through the upstream
    # reverse proxy (it doesn't route /healthz). Internal-only.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
